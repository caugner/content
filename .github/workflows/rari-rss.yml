name: Rari max RSS experiment

on:
  push:
    branches:
      - rari-rss-experiment

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: musl, target: x86_64-unknown-linux-musl, ref: b4777e98b029124c338d62d1ec0a65ddcc8b9c71 }
          - { name: musl-mimalloc, target: x86_64-unknown-linux-musl, ref: e1263bd2128ecf37f23f1df1172bd93868c2694a }
          - { name: gnu, target: x86_64-unknown-linux-gnu, ref: b4777e98b029124c338d62d1ec0a65ddcc8b9c71 }
    name: measure (${{ matrix.name }})
    env:
      CONTENT_ROOT: ${{ github.workspace }}/files
      BUILD_FLAW_LEVELS: "unsafe_html: error, *:warn"
    steps:
      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout rari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/rari
          ref: ${{ matrix.ref }}
          path: rari
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools time

      - name: Build rari
        working-directory: rari
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --profile release-lto --target "$TARGET" -p rari
          strings "target/$TARGET/release-lto/rari" | grep -c -i mimalloc || true

      - name: Build content twice and record max RSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          BIN="$GITHUB_WORKSPACE/rari/target/$TARGET/release-lto/rari"
          OUT="$RUNNER_TEMP/build"
          {
            echo "## $VARIANT"
            echo
            echo "nproc: $(nproc), mem: $(free -m | awk '/Mem:/ {print $2}') MB"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2; do
            rm -rf "$OUT"
            mkdir -p "$OUT"
            skip=""
            if [ "$run" = 2 ]; then skip="RARI_SKIP_UPDATES=true"; fi
            env $skip BUILD_OUT_ROOT="$OUT" /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
              "$BIN" build --issues "$OUT/issues.json" > "$RUNNER_TEMP/log.txt" 2>&1
            {
              echo "### run $run"
              echo
              echo '```'
              grep -E "Took" "$RUNNER_TEMP/log.txt" || true
              grep -E "Elapsed|User time|System time|Maximum resident" "$RUNNER_TEMP/time.txt"
              echo '```'
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
